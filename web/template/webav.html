<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>GOFLIX | {{file_name}}</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.12/plyr.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── THEME VARIABLES ── */
    :root {
      --red: #e50914;
      --red-glow: rgba(229, 9, 20, 0.15);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* DARK THEME (Default) */
    [data-theme="dark"] {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --surface3: #242424;
      --border: #2a2a2a;
      --border-light: #333;
      --text: #f0f0f0;
      --text-secondary: #a0a0a0;
      --muted: #666;
      --card-bg: #141414;
      --header-bg: rgba(10, 10, 10, 0.95);
      --modal-bg: #1a1a1a;
      --toast-bg: rgba(30, 30, 30, 0.95);
      --shadow: rgba(0, 0, 0, 0.5);
      --player-bg: #000;
      --progress-track: #1e1e1e;
      --badge-bg: rgba(229, 9, 20, 0.08);
      --badge-border: rgba(229, 9, 20, 0.2);
    }

    /* LIGHT THEME */
    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface2: #f0f0f2;
      --surface3: #e8e8ec;
      --border: #e0e0e5;
      --border-light: #d0d0d5;
      --text: #1a1a1a;
      --text-secondary: #555;
      --muted: #888;
      --card-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.95);
      --modal-bg: #ffffff;
      --toast-bg: rgba(40, 40, 40, 0.95);
      --shadow: rgba(0, 0, 0, 0.08);
      --player-bg: #111;
      --progress-track: #e0e0e5;
      --badge-bg: rgba(229, 9, 20, 0.06);
      --badge-border: rgba(229, 9, 20, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── THEME TOGGLE ── */
    .theme-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      width: 48px;
      height: 28px;
      position: relative;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      padding: 0 4px;
      margin-left: 12px;
    }

    .theme-toggle:hover {
      border-color: var(--border-light);
      transform: scale(1.05);
    }

    .theme-toggle-ball {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--red);
      position: absolute;
      left: 4px;
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(229, 9, 20, 0.3);
    }

    [data-theme="light"] .theme-toggle-ball {
      transform: translateX(20px);
    }

    .theme-toggle .sun-icon { display: none; }
    .theme-toggle .moon-icon { display: block; }

    [data-theme="light"] .theme-toggle .sun-icon { display: block; }
    [data-theme="light"] .theme-toggle .moon-icon { display: none; }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 200;
      animation: slideDown 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── BOLD GOFLIX LOGO (SMALLER, NO UNDERLINE) ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .logo-main {
      font-family: 'Oswald', 'Bebas Neue', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      display: flex;
      gap: 1px;
      text-transform: uppercase;
    }

    .logo-main .l {
      display: inline-block;
      animation: letterBounce 2s ease-in-out infinite;
    }

    .logo-main .l:nth-child(1) { 
      color: #e50914; 
      animation-delay: 0s; 
      font-weight: 800;
    }
    .logo-main .l:nth-child(2) { 
      color: #e50914; 
      animation-delay: 0.12s; 
      font-weight: 800;
    }
    .logo-main .l:nth-child(3) { 
      color: var(--text); 
      animation-delay: 0.24s; 
      font-weight: 700;
    }
    .logo-main .l:nth-child(4) { 
      color: var(--text); 
      animation-delay: 0.36s; 
      font-weight: 700;
    }
    .logo-main .l:nth-child(5) { 
      color: var(--text); 
      animation-delay: 0.48s; 
      font-weight: 700;
    }
    .logo-main .l:nth-child(6) { 
      color: var(--text); 
      animation-delay: 0.60s; 
      font-weight: 700;
    }

    @keyframes letterBounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-4px); }
      60% { transform: translateY(1px); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: 24px;
      padding: 6px 14px;
      font-size: 11px;
      color: var(--red);
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: background 0.4s, border-color 0.4s;
    }

    .header-badge i { 
      font-size: 8px; 
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ── PLAYER ── */
    .player-section {
      background: var(--player-bg);
      position: relative;
      box-shadow: 0 20px 60px var(--shadow);
    }

    .plyr {
      --plyr-color-main: #e50914;
      --plyr-video-control-color: #fff;
      --plyr-video-control-background-hover: rgba(229, 9, 20, 0.9);
      width: 100%;
      max-height: 72vh;
    }

    .plyr--video .plyr__controls {
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      padding: 20px 15px 15px;
    }

    /* ── CONTENT ── */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 18px 60px;
      width: 100%;
    }

    /* ── FILE TITLE ── */
    .file-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 16px 0 6px;
      line-height: 1.4;
      word-break: break-word;
      letter-spacing: -0.2px;
    }

    .file-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .file-meta i {
      color: var(--text-secondary);
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 24px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: var(--border);
      border-radius: 50%;
      transition: background 0.4s;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::before {
      content: '';
      display: block;
      width: 24px;
      height: 2px;
      background: var(--red);
      border-radius: 2px;
    }

    /* ── PLAYER BUTTONS ── */
    .player-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 8px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn-player::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-player::after {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-player:active::after { opacity: 0.06; }

    .btn-player i { 
      font-size: 24px; 
      transition: transform 0.3s ease;
    }

    .btn-player:hover {
      background: var(--surface2);
      border-color: var(--border-light);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px var(--shadow);
    }

    .btn-player:hover::before { opacity: 1; }
    .btn-player:hover i { transform: scale(1.1); }

    .btn-player.mx { color: #ff6b35; }
    .btn-player.vlc { color: #f08000; }
    .btn-player.playit { color: #00c6ff; }

    .btn-player.mx:hover { 
      border-color: rgba(255, 107, 53, 0.4); 
      box-shadow: 0 12px 30px rgba(255, 107, 53, 0.1);
    }
    .btn-player.vlc:hover { 
      border-color: rgba(240, 128, 0, 0.4); 
      box-shadow: 0 12px 30px rgba(240, 128, 0, 0.1);
    }
    .btn-player.playit:hover { 
      border-color: rgba(0, 198, 255, 0.4); 
      box-shadow: 0 12px 30px rgba(0, 198, 255, 0.1);
    }

    /* ── ACTION BUTTONS ── */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      border-radius: var(--radius);
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    .btn-action::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }

    .btn-action:hover::after { transform: translateX(100%); }

    .btn-action:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 12px 30px var(--shadow); 
    }
    
    .btn-action:active { transform: translateY(-1px); }

    .btn-download {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 20px rgba(229, 9, 20, 0.3);
    }

    .btn-download:hover { 
      background: #ff1a25; 
      box-shadow: 0 8px 30px rgba(229, 9, 20, 0.4); 
    }

    .btn-share {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px var(--shadow);
    }

    [data-theme="light"] .btn-share {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
    }

    .btn-share:hover { 
      background: var(--surface2); 
      box-shadow: 0 8px 30px var(--shadow); 
    }

    [data-theme="light"] .btn-share:hover {
      background: #2a2a2a;
    }

    .btn-share i {
      color: var(--red);
    }

    /* ── TELEGRAM BUTTON ── */
    .btn-telegram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #1a2744 0%, #162038 50%, #1a2744 100%);
      background-size: 200% 200%;
      color: #5aadff;
      border: 1px solid rgba(90, 173, 255, 0.2);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      width: 100%;
      transition: var(--transition);
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .btn-telegram::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(90, 173, 255, 0.1), transparent);
      transition: left 0.6s;
    }

    .btn-telegram:hover::before { left: 100%; }

    .btn-telegram:hover {
      color: #7ec4ff;
      border-color: rgba(90, 173, 255, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(90, 173, 255, 0.15);
      background-position: 100% 100%;
    }

    /* ── FILE INFO CARD ── */
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px var(--shadow);
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s, border-color 0.4s;
    }

    .info-row:hover { background: rgba(128, 128, 128, 0.05); }
    .info-row:last-child { border-bottom: none; }

    .info-row .label { 
      color: var(--muted); 
      font-size: 13px; 
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-row .value {
      color: var(--text-secondary);
      font-weight: 600;
      text-align: right;
      max-width: 65%;
      word-break: break-word;
      font-size: 13px;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.5px;
      background: var(--surface);
      transition: background 0.4s, border-color 0.4s, color 0.4s;
    }

    footer a { 
      color: var(--red); 
      text-decoration: none; 
      font-weight: 600;
      transition: opacity 0.2s;
    }

    footer a:hover { opacity: 0.8; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--toast-bg);
      color: #fff;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 999;
      white-space: nowrap;
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px var(--shadow);
      backdrop-filter: blur(10px);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── MX FALLBACK MODAL ── */
    #mx-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 500;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    #mx-modal.open { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .mx-sheet {
      background: linear-gradient(180deg, var(--modal-bg) 0%, var(--surface) 100%);
      border-top: 1px solid var(--border-light);
      border-radius: 24px 24px 0 0;
      padding: 28px 24px 40px;
      width: 100%;
      max-width: 500px;
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      box-shadow: 0 -10px 40px var(--shadow);
      transition: background 0.4s, border-color 0.4s;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .mx-sheet h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .mx-sheet p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .mx-sheet .mx-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mx-sheet .mx-btns a, .mx-sheet .mx-btns button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.2s;
    }

    .mx-sheet .mx-btns a:hover, .mx-sheet .mx-btns button:hover { 
      transform: translateY(-2px); 
    }

    .btn-mx-open { 
      background: #ff6b35; 
      color: #fff; 
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }
    
    .btn-mx-install { 
      background: var(--surface2); 
      color: var(--text); 
      border: 1px solid var(--border) !important; 
    }
    
    .btn-mx-cancel { 
      grid-column: span 2; 
      background: transparent; 
      color: var(--muted); 
      font-size: 13px; 
      margin-top: 4px;
    }

    /* ── SERVER STATUS ── */
    .server-status {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 20px var(--shadow);
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .status-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .status-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(76, 175, 80, 0.1);
      color: #4caf50;
      border: 1px solid rgba(76, 175, 80, 0.2);
      transition: all 0.5s;
    }

    .status-badge.medium {
      background: rgba(255, 152, 0, 0.1);
      color: #ff9800;
      border-color: rgba(255, 152, 0, 0.2);
    }

    .status-badge.high {
      background: rgba(244, 67, 54, 0.1);
      color: #f44336;
      border-color: rgba(244, 67, 54, 0.2);
    }

    .progress-track {
      background: var(--progress-track);
      border-radius: 30px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
      transition: background 0.4s;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 30px;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.5s;
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right:

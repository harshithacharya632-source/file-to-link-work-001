<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GOFLIX | {{file_name}}</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.12/plyr.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #e50914;
      --red-dim: #b0060f;
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #0a0a0a;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--red);
      text-decoration: none;
    }

    .logo span {
      color: var(--text);
    }

    .header-right {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── PLAYER WRAPPER ── */
    .player-section {
      background: #000;
      position: relative;
    }

    .plyr {
      --plyr-color-main: var(--red);
      --plyr-video-control-color: #fff;
      width: 100%;
      max-height: 70vh;
    }

    /* ── CONTENT ── */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      width: 100%;
    }

    /* ── FILE TITLE ── */
    .file-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin: 16px 0 4px;
      line-height: 1.4;
      word-break: break-word;
    }

    .file-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── PLAYER BUTTONS ── */
    .player-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 8px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-player i {
      font-size: 20px;
    }

    .btn-player:hover, .btn-player:active {
      background: var(--surface2);
      border-color: #444;
      transform: translateY(-1px);
      color: var(--text);
    }

    .btn-player.mx i { color: #ff6b35; }
    .btn-player.vlc i { color: #f08000; }
    .btn-player.playit i { color: #00c6ff; }

    /* ── ACTION BUTTONS ── */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.3px;
    }

    .btn-action:hover, .btn-action:active {
      opacity: 0.85;
      transform: translateY(-1px);
      color: inherit;
    }

    .btn-download {
      background: var(--red);
      color: #fff;
    }

    .btn-share {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-telegram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      border-radius: var(--radius);
      background: #1a2744;
      color: #5aadff;
      border: 1px solid #1e3460;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      width: 100%;
      transition: opacity 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 10px;
    }

    .btn-telegram:hover {
      opacity: 0.85;
      color: #5aadff;
      transform: translateY(-1px);
    }

    /* ── FILE INFO CARD ── */
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .info-row:last-child { border-bottom: none; }

    .info-row .label {
      color: var(--muted);
      font-weight: 400;
    }

    .info-row .value {
      color: var(--text);
      font-weight: 500;
      text-align: right;
      max-width: 65%;
      word-break: break-word;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.5px;
    }

    footer a {
      color: var(--red);
      text-decoration: none;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .player-buttons { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .btn-player { padding: 12px 4px; font-size: 11px; }
      .btn-player i { font-size: 18px; }
      .action-buttons { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <span class="logo">GO<span>FLIX</span></span>
    <span class="header-right">Stream Player</span>
  </header>

  <!-- PLAYER -->
  <div class="player-section">
    <video id="myVideo" playsinline>
      <source src="{{file_url}}" type="video/mp4">
    </video>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <p class="file-title">{{file_name}}</p>
    <p class="file-meta">{{file_size}}</p>

    <div class="divider"></div>

    <!-- EXTERNAL PLAYERS -->
    <p class="section-label">Open in App</p>
    <div class="player-buttons">
      <button class="btn-player mx" onclick="mx_player()">
        <i class="fa-solid fa-play-circle"></i>
        MX Player
      </button>
      <button class="btn-player vlc" onclick="vlc_player()">
        <i class="fa-solid fa-circle-play"></i>
        VLC
      </button>
      <button class="btn-player playit" onclick="playit_player()">
        <i class="fa-solid fa-tv"></i>
        Play it
      </button>
    </div>

    <!-- DOWNLOAD + SHARE -->
    <div class="action-buttons">
      <button class="btn-action btn-download" onclick="streamDownload()">
        <i class="fa-solid fa-download"></i> Download
      </button>
      <button class="btn-action btn-share" onclick="shareButton()">
        <i class="fa-solid fa-share-nodes"></i> Share
      </button>
    </div>

    <!-- TELEGRAM -->
    <button class="btn-telegram" onclick="showLinkModal('{{tg_button}}')">
      <i class="fa-brands fa-telegram"></i> Create Link Like This
    </button>

    <div class="divider"></div>

    <!-- FILE INFO -->
    <p class="section-label">File Info</p>
    <div class="info-card">
      <div class="info-row">
        <span class="label">Name</span>
        <span class="value">{{file_name}}</span>
      </div>
      <div class="info-row">
        <span class="label">Size</span>
        <span class="value">{{file_size}}</span>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    Powered by <a href="https://t.me/Goflix_Disscussion">GOFLIX</a> &nbsp;·&nbsp; Stream, Watch, Enjoy
  </footer>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.plyr.io/3.6.12/plyr.js"></script>
  <script>
    // Init Plyr
    const player = new Plyr('#myVideo', {
      controls: ['play-large','play','progress','current-time','duration','mute','volume','fullscreen'],
      resetOnEnd: false,
      keyboard: { focused: true, global: true }
    });

    const fileUrl = "{{file_url}}";
    const fileName = "{{file_name}}";

    // Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // MX Player
    function mx_player() {
      const encoded = encodeURIComponent(fileUrl);
      const intentUrl = `intent:${fileUrl}#Intent;package=com.mxtech.videoplayer.ad;S.title=${encodeURIComponent(fileName)};end`;
      window.location.href = intentUrl;
      setTimeout(() => showToast("Opening MX Player..."), 300);
    }

    // VLC Player
    function vlc_player() {
      const intentUrl = `intent:${fileUrl}#Intent;package=org.videolan.vlc;action=android.intent.action.VIEW;type=video/*;end`;
      window.location.href = intentUrl;
      setTimeout(() => showToast("Opening VLC..."), 300);
    }

    // Play it
    function playit_player() {
      const intentUrl = `intent:${fileUrl}#Intent;package=com.playit.videoplayer;action=android.intent.action.VIEW;type=video/*;end`;
      window.location.href = intentUrl;
      setTimeout(() => showToast("Opening Play it..."), 300);
    }

    // Download
    function streamDownload() {
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName;
      a.click();
      showToast("Download started...");
    }

    // Share
    function shareButton() {
      if (navigator.share) {
        navigator.share({ title: fileName, url: window.location.href })
          .catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href)
          .then(() => showToast("Link copied!"))
          .catch(() => showToast("Copy the URL from address bar"));
      }
    }

    // Telegram link modal
    function showLinkModal(url) {
      if (url && url !== 'None' && url !== '') {
        window.open(url, '_blank');
      } else {
        showToast("No Telegram link available");
      }
    }
  </script>
</body>
</html>
